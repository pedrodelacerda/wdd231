<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrintHub 3D | Custom Fabrication Quote & Support</title>
  <meta name="description" content="Request a custom 3D printing quote or contact support for technical specifications.">
  <meta name="author" content="Pedro Henrique Cordeiro de Lacerda Ribeiro">
  
  <meta property="og:title" content="PrintHub 3D - Quote & Support">
  <meta property="og:type" content="website">
  <meta property="og:image" content="images/og-image.png">
  <meta property="og:url" content="https://pedro.github.io/wdd231/final/contact.html">

  <link rel="icon" href="images/favicon.ico" type="image/x-icon">
  
  <link rel="stylesheet" href="styles/normalize.css">
  <link rel="stylesheet" href="styles/mobile.css">
  <link rel="stylesheet" href="styles/desktop.css" media="(min-width: 768px)">

  <script type="module" src="scripts/main.js" defer></script>
</head>
<body>

  <header>
    <div class="logo-container">
      <img src="images/favicon.ico" alt="PrintHub 3D Logo" width="32" height="32">
      <h1>PrintHub 3D</h1>
    </div>
    <nav>
      <button id="hamburger-btn" aria-label="Toggle navigation menu">&#9776;</button>
      <ul id="nav-menu">
        <li><a href="index.html">Catalog</a></li>
        <li><a href="comparison.html">Comparison & Saved</a></li>
        <li><a href="contact.html" class="active">Quote & Support</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h2>Custom Fabrication Quote</h2>
    <!-- O formulário envia dados via GET para form-action.html -->
    <form action="form-action.html" method="get" style="display: flex; flex-direction: column; gap: 1rem; max-width: 500px;">
      <label>
        Full Name:
        <input type="text" name="fullname" required style="width: 100%; padding: 0.5rem;">
      </label>
      <label>
        Email:
        <input type="email" name="email" required style="width: 100%; padding: 0.5rem;">
      </label>
      <label>
        Printer Model / Technology Interest:
        <select name="technology" style="width: 100%; padding: 0.5rem;">
          <option value="FDM High-Speed">FDM High-Speed</option>
          <option value="SLA Precision Resin">SLA Precision Resin</option>
        </select>
      </label>
      <label>
        Project Details:
        <textarea name="details" rows="5" required style="width: 100%; padding: 0.5rem;"></textarea>
      </label>
      <button type="submit" class="btn-primary">Submit Quote Request</button>
    </form>
  </main>

  <footer>
    <p>&copy; <span id="current-year"></span> PrintHub 3D | <a href="attributions.html">Attributions</a> | <a href="https://youtu.be/SEU_VIDEO_LINK">Video Demonstration</a></p>
  </footer>
</body>
</html>
