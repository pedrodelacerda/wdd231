<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrintHub 3D | Custom Fabrication Quote &amp; Support</title>
  <meta name="description" content="Request a custom 3D printing quote or contact support for technical specifications.">
  <meta name="author" content="Pedro Henrique Cordeiro de Lacerda Ribeiro">
  
  <meta property="og:title" content="PrintHub 3D - Custom Fabrication Quote &amp; Support">
  <meta property="og:type" content="website">
  <meta property="og:description" content="Request a custom 3D printing quote or contact support for technical specifications.">
  <meta property="og:image" content="https://pedrodelacerda.github.io/wdd231/final/images/og-image.png">
  <meta property="og:url" content="https://pedrodelacerda.github.io/wdd231/final/contact.html">

  <link rel="icon" href="images/favicon.ico" type="image/x-icon">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/normalize.css">
  <link rel="stylesheet" href="styles/mobile.css">
  <link rel="stylesheet" href="styles/desktop.css" media="(min-width: 768px)">

  <script type="module" src="scripts/main.js" defer></script>
</head>
<body>

  <header>
    <div class="logo-container">
      <img src="images/favicon.ico" alt="PrintHub 3D Logo" width="32" height="32">
      <span class="site-title">PrintHub 3D</span>
    </div>
    <nav>
      <button id="hamburger-btn" aria-label="Toggle navigation menu">&#9776;</button>
      <ul id="nav-menu">
        <li><a href="index.html">Catalog</a></li>
        <li><a href="comparison.html">Comparison &amp; Saved</a></li>
        <li><a href="contact.html" class="active">Quote &amp; Support</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Custom Fabrication Quote</h1>
    
    <form action="form-action.html" method="get" class="quote-form">
      <label>
        Full Name:
        <input type="text" name="fullname" required>
      </label>
      <label>
        Email:
        <input type="email" name="email" required>
      </label>
      <label>
        <select name="technology">
          <option value="FDM High-Speed">FDM High-Speed</option>
          <option value="SLA Precision Resin">SLA Precision Resin</option>
        </select>
      </label>
      <label>
        <textarea name="details" rows="5" required></textarea>
      </label>
      <button type="submit" class="btn-primary">Submit Quote Request</button>
    </form>
  </main>

  <footer>
    <p>&copy; <span id="current-year"></span> PrintHub 3D | Pedro Henrique Cordeiro de Lacerda Ribeiro</p>
    <p>Last Modified: <span id="last-modified"></span></p>
    <p><a href="attributions.html">Attributions</a> | <a href="https://youtu.be/SEU_VIDEO_LINK" target="_blank" rel="noopener">Project Video Demonstration</a></p>
  </footer>

</body>
</html>
